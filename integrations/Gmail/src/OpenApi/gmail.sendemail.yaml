openapi: 3.1.1
info:
  title: Integration Platform - SendEmail
  description: API for sending emails via the SendEmail function.
  version: 0.0.0
servers:
  - url: https://func-int-gmail.azurewebsites.net
paths:
  /api/send-email:
    post:
      operationId: sendEmail
      summary: Send an email
      description: Sends an email using configured SMTP settings.
      security:
        - functionKeyQuery: []
        - functionKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailRequest"
            examples:
              basic:
                summary: Basic request
                value:
                  to: "chandler@friends.com"
                  subject: "How you doin'?"
                  body: "Hello Chandler, how are you?"
                  isHtml: false
      responses:
        "202":
          description: Accepted
        "400":
          description: Invalid or disallowed recipients, or invalid request.
        "500":
          description: Server error while sending email.
components:
  securitySchemes:
    functionKeyQuery:
      type: apiKey
      in: query
      name: code
    functionKeyHeader:
      type: apiKey
      in: header
      name: x-functions-key
  schemas:
    SendEmailRequest:
      type: object
      required:
        - subject
        - body
      properties:
        to:
          type: string
          nullable: true
          description: Optional recipients list separated by comma or semicolon. If omitted, the email is sent to the default recipient. All recipients must be on the allowed recipients list.
        subject:
          type: string
        body:
          type: string
        isHtml:
          type: boolean
          default: false
