name: Shared - Deploy Infrastructure

on:
  workflow_dispatch:

concurrency:
  group: integration-platform-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Build and Deploy Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build infrastructure
        uses: $/.github/actions/build-infrastructure
        with:
          infra-directory: ./infrastructure/shared

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infrastructure
        uses: $/.github/actions/deploy-infrastructure
        with:
          infra-directory: ./infrastructure/shared
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
