name: Shared - Deploy Infrastructure

on:
  workflow_dispatch:

jobs:
  build-infrastructure:
    name: Build Shared Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build infrastructure
        uses: $/.github/actions/build-infrastructure
        with:
          infra-directory: ./infrastructure/shared

      - name: Upload infrastructure artifact
        uses: actions/upload-artifact@v7
        with:
          name: infra
          path: |
            infrastructure/shared/main.json
            infrastructure/shared/parameters.json
          if-no-files-found: error

  deploy-infrastructure:
    name: Deploy Shared Infrastructure
    needs: [build-infrastructure]
    concurrency:
      group: integration-platform-deploy
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download infrastructure artifact
        uses: actions/download-artifact@v8
        with:
          name: infra
          path: infra

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infrastructure
        uses: $/.github/actions/deploy-infrastructure
        with:
          infra-directory: infra
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
