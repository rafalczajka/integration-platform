name: Lotto - Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - '.github/actions/**'
      - '.github/workflows/_reusable.deploy-integration.yml'
      - 'integrations/Lotto/infra/**'
      - 'integrations/Lotto/src/**'
      - 'infrastructure/modules/**'
      - 'infrastructure/lib/**'
      - 'Directory.*.props'
      - 'global.json'

  workflow_dispatch:

concurrency:
  group: integration-platform-deploy
  queue: max
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Integration
    uses: $/.github/workflows/_reusable.deploy-integration.yml
    with:
      infra-directory: ./integrations/Lotto/infra
      integration-directory: ./integrations/Lotto
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
      azure-resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
